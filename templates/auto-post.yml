name: Auto-post project update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to post about (for backfilling a merge that already landed).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auto-post-${{ github.event.inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        working-directory: .github/auto-post
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        working-directory: .github/auto-post
        run: npx playwright install --with-deps chromium

      - name: Resolve repo homepage URL
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOMEPAGE=$(gh api repos/${{ github.repository }} -q .homepage)
          if [ "$HOMEPAGE" = "null" ]; then HOMEPAGE=""; fi
          echo "homepage=$HOMEPAGE" >> "$GITHUB_OUTPUT"
          # post.mjs decides whether homepage URL is required (cover.png override skips it).

      - name: Generate post and publish to X
        working-directory: .github/auto-post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # workflow_dispatch input wins if present (backfill mode); otherwise the push SHA.
          GITHUB_SHA: ${{ github.event.inputs.sha || github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          TRIGGER: ${{ github.event_name }}
          HOMEPAGE_URL: ${{ steps.meta.outputs.homepage }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node post.mjs
