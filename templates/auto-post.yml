name: Auto-post project update

# VENDORED workflow (self-contained). Prefer the referenced composite action
# instead — a thin caller that `uses: e4-explore/e4-efficiency/actions/auto-post@v1`
# so fixes propagate without re-vendoring. See docs/setup.md. This file remains
# for consumers who want everything in-repo with no external action dependency.

on:
  push:
    branches: [main]
    # The history commit made by this workflow must not retrigger it.
    paths-ignore:
      - '.github/auto-post/history.jsonl'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to post about (for backfilling a merge that already landed).'
        required: true
        type: string
      dry-run:
        description: 'Run the pipeline (draft + screenshot) but do NOT publish to X. Preview in the job summary.'
        required: false
        default: false
        type: boolean
      before-sha:
        description: 'Optional: diff against this SHA instead of the single commit at `sha` (for backfilling a merge commit correctly, or testing). Leave empty to use the single-commit diff.'
        required: false
        default: ''
        type: string

permissions:
  contents: write # read the repo + commit history.jsonl back
  pull-requests: read # PR title/body give the post its "why" (best-effort)

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  post:
    # `[skip post]` in a commit message suppresses the post for that commit only
    # (e.g. the commit that installs this workflow). head_commit is null on
    # workflow_dispatch, so contains() is false there and backfill still runs.
    if: ${{ !contains(github.event.head_commit.message, '[skip post]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25 # deploy-gate can wait up to 12 min for a deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the history.jsonl commit-back can rebase cleanly.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        working-directory: .github/auto-post
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        working-directory: .github/auto-post
        run: npx playwright install --with-deps chromium

      - name: Resolve repo homepage URL
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOMEPAGE=$(gh api repos/${{ github.repository }} -q .homepage)
          if [ "$HOMEPAGE" = "null" ]; then HOMEPAGE=""; fi
          echo "homepage=$HOMEPAGE" >> "$GITHUB_OUTPUT"
          # post.mjs decides whether homepage URL is required
          # (cover.png and config.json preview modes skip it).

      # Optional deploy-gate: set the repo variable DEPLOY_GATE_HEALTH_URL to a
      # health endpoint that reports the deployed commit SHA, and this step
      # waits (on push only) until it serves the pushed commit before
      # screenshotting — so a lagging deploy can't yield an old-UI screenshot.
      # Optional vars: DEPLOY_GATE_SHA_JSON_PATH (jq path, default .commit),
      # DEPLOY_GATE_TIMEOUT_SECONDS (default 720).
      - name: Wait for deploy
        if: github.event_name == 'push' && vars.DEPLOY_GATE_HEALTH_URL != ''
        env:
          TARGET_SHA: ${{ github.sha }}
          HEALTH_URL: ${{ vars.DEPLOY_GATE_HEALTH_URL }}
          SHA_JSON_PATH: ${{ vars.DEPLOY_GATE_SHA_JSON_PATH || '.commit' }}
          TIMEOUT: ${{ vars.DEPLOY_GATE_TIMEOUT_SECONDS || '720' }}
        run: |
          echo "Waiting for $HEALTH_URL to report commit $TARGET_SHA (path '$SHA_JSON_PATH', up to ${TIMEOUT}s)."
          deadline=$(( $(date +%s) + TIMEOUT ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            deployed=$(curl -fsS "$HEALTH_URL?t=$(date +%s)" | jq -r "${SHA_JSON_PATH} // empty" || true)
            if [ "$deployed" = "$TARGET_SHA" ]; then
              echo "Deployed commit matches target — proceeding."
              exit 0
            fi
            echo "Deployed commit is '${deployed:-<none>}'; not yet '$TARGET_SHA'. Retrying in 15s…"
            sleep 15
          done
          echo "::error::Deploy of $TARGET_SHA not detected within ${TIMEOUT}s; refusing to post a stale screenshot."
          exit 1

      - name: Generate post and publish to X
        id: post
        working-directory: .github/auto-post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # workflow_dispatch input wins if present (backfill mode); otherwise the push SHA.
          GITHUB_SHA: ${{ github.event.inputs.sha || github.sha }}
          # Explicit dispatch input wins (manual backfill/test); otherwise the
          # push event's own "before" (empty on workflow_dispatch, which has none).
          GITHUB_BEFORE_SHA: ${{ github.event.inputs.before-sha || github.event.before }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          TRIGGER: ${{ github.event_name }}
          # Preview without publishing: run with workflow_dispatch dry-run=true.
          DRY_RUN: ${{ github.event.inputs.dry-run }}
          HOMEPAGE_URL: ${{ steps.meta.outputs.homepage }}
          # Interactive shots (drive the page to a better state before shooting)
          # are on by default; set repo variable INTERACTIVE_SHOTS=false to
          # disable, or INTERACTION_HINTS to steer it (e.g. "prefer a branded
          # theme and composed example screens").
          INTERACTIVE_SHOTS: ${{ vars.INTERACTIVE_SHOTS }}
          INTERACTION_HINTS: ${{ vars.INTERACTION_HINTS }}
          # A push can bundle several distinct changes; this caps how many get
          # their own image/line in the post (1-4, hard-capped at 4 — X's own
          # limit). Set repo variable MAX_BUNDLE_IMAGES to override the default.
          MAX_BUNDLE_IMAGES: ${{ vars.MAX_BUNDLE_IMAGES }}
          # Optional: set repo variable INCLUDE_COMMIT_LINK=true to append the commit URL.
          INCLUDE_COMMIT_LINK: ${{ vars.INCLUDE_COMMIT_LINK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node post.mjs

      # Dry-run only: GITHUB_STEP_SUMMARY is text-only, so the chosen image(s)
      # can't ride along in it — upload the actual PNGs (absolute paths on the
      # runner, written by post.mjs to $GITHUB_OUTPUT, one per line when a
      # push bundles multiple changes) as a downloadable artifact instead.
      - name: Upload dry-run preview image(s)
        if: success() && github.event.inputs.dry-run == 'true' && steps.post.outputs.image_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: auto-post-dry-run-preview
          path: ${{ steps.post.outputs.image_paths }}
          retention-days: 7

      - name: Persist post history
        # Skip in dry-run: nothing was posted, so there's no history to commit.
        if: success() && github.event.inputs.dry-run != 'true'
        # Commit as the triggering actor's real github-noreply identity. A
        # fabricated bot identity can be rejected by deploy platforms that map
        # commit author → GitHub account (e.g. Vercel deploys it as "Blocked").
        env:
          HISTORY_NAME: ${{ github.actor }}
          HISTORY_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          git config user.name "$HISTORY_NAME"
          git config user.email "$HISTORY_EMAIL"
          git add .github/auto-post/history.jsonl
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "chore(auto-post): record post history [skip ci]"
          # main may have moved while this job ran; rebase our one commit onto
          # its tip. Works from the detached HEAD that actions/checkout leaves.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
