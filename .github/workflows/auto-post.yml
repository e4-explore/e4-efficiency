name: Auto-post project update

on:
  push:
    branches: [main]
    # The history commit made by this workflow must not retrigger it.
    paths-ignore:
      - '.github/auto-post/history.jsonl'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to post about (for backfilling a merge that already landed).'
        required: true
        type: string

permissions:
  contents: write # read the repo + commit history.jsonl back

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # local preview mode may run a full build
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the history.jsonl commit-back can rebase cleanly.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        working-directory: .github/auto-post
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        working-directory: .github/auto-post
        run: npx playwright install --with-deps chromium

      - name: Resolve repo homepage URL
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOMEPAGE=$(gh api repos/${{ github.repository }} -q .homepage)
          if [ "$HOMEPAGE" = "null" ]; then HOMEPAGE=""; fi
          echo "homepage=$HOMEPAGE" >> "$GITHUB_OUTPUT"
          # post.mjs decides whether homepage URL is required
          # (cover.png and config.json preview modes skip it).

      - name: Generate post and publish to X
        working-directory: .github/auto-post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # workflow_dispatch input wins if present (backfill mode); otherwise the push SHA.
          GITHUB_SHA: ${{ github.event.inputs.sha || github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          TRIGGER: ${{ github.event_name }}
          HOMEPAGE_URL: ${{ steps.meta.outputs.homepage }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node post.mjs

      - name: Persist post history
        if: success()
        run: |
          git config user.name "auto-post[bot]"
          git config user.email "auto-post[bot]@users.noreply.github.com"
          git add .github/auto-post/history.jsonl
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "chore(auto-post): record post history [skip ci]"
          # main may have moved while this job ran; rebase our one commit onto
          # its tip. Works from the detached HEAD that actions/checkout leaves.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
