name: 'Project update auto-poster'
description: 'Generate and publish an in-voice X post about a merge, with a screenshot of the change.'

# Composite actions cannot read the `secrets` context, so every secret is
# passed in as an input by the caller (e.g. `${{ secrets.GEMINI_API_KEY }}`).
inputs:
  gemini-api-key:
    description: 'Google Gemini API key (free tier is fine).'
    required: true
  x-api-key:
    description: 'X (Twitter) OAuth 1.0a consumer API key.'
    required: true
  x-api-secret:
    description: 'X consumer API secret.'
    required: true
  x-access-token:
    description: 'X access token (Read+Write).'
    required: true
  x-access-token-secret:
    description: 'X access token secret.'
    required: true
  homepage-url:
    description: 'Deployed site to screenshot. Required unless the consumer uses cover.png or a config.json preview build.'
    required: false
    default: ''
  routes:
    description: 'JSON array of route paths to hint the screenshotter, e.g. ''["/", "/players"]''.'
    required: false
    default: ''
  interactive-shots:
    description: 'When "true" (default), the screenshotter may click/hover/select navigational and display controls to drive the page to a more compelling state before shooting (e.g. open the right screen, switch to a branded theme, open a menu). Set "false" to only screenshot routes as-loaded. Never triggers mutating/financial/account/send actions.'
    required: false
    default: 'true'
  interaction-hints:
    description: 'Optional free-text steering for interactive shots, e.g. "Prefer a branded (non-wireframe) theme and composed example screens over atomic component stories."'
    required: false
    default: ''
  interaction-videos:
    description: 'When "true" (default), a change the model flags as an interaction/motion (drag/reorder, expand/collapse, tab switch, hover reveal, animation) is captured as a short screen recording (mp4) instead of a still — the interaction is driven with a synthetic cursor. Needs ffmpeg (present on GitHub-hosted runners) and interactive-shots enabled; falls back to a still on any trouble. Set "false" to always post stills.'
    required: false
    default: 'true'
  zoom-camera:
    description: 'When "true" (default), interaction recordings get a cinematic camera: an eased zoom-in around the showcase interaction (click, drag, hover reveal), a short hold, then an eased zoom-out — the "FocuSee / Screen Studio" look. Purely presentational and self-degrading: any camera trouble falls back to a plain recording. Set "false" for flat clips.'
    required: false
    default: 'true'
  max-bundle-images:
    description: 'A push can bundle several distinct changes (e.g. a few small fixes made alongside one main feature); this caps how many get their own image/line in the post, 1-4. Hard-capped at 4 (X''s own max images per post) regardless of this value. Most pushes are one coherent change and get exactly 1 image either way.'
    required: false
    default: '4'
  include-commit-link:
    description: 'Append the commit URL to the post text ("true"/"false").'
    required: false
    default: 'false'
  optimize-post:
    description: 'When "true" (default), after the editor pass the draft is scored the way X''s ranking model would score it (via the bundled post-scorer) and, if below the target, iterated higher while staying inside the voice rules. Additive and safe: the editor and publish steps are unchanged, and it self-skips on any trouble. Set "false" to publish the editor''s draft as-is.'
    required: false
    default: 'true'
  optimize-target:
    description: 'Target 0–100 post score to stop optimizing at (default 80). Higher chases more rewrites; the best-scoring version is always kept regardless.'
    required: false
    default: '80'
  optimize-iterations:
    description: 'Max rewrite attempts during score optimization, 0–4 (default 2). 0 disables it just like optimize-post:false.'
    required: false
    default: '2'
  post-scorer-license-key:
    description: 'License key for the paid optimizer (@e4/post-scorer-pro). Without it you still get the free tier: every draft is scored and its weak spots logged, just not auto-optimized. Pass the caller''s POST_SCORER_LICENSE_KEY secret.'
    required: false
    default: ''
  gemini-model:
    description: 'Pin a specific Gemini model id; otherwise the built-in fallback chain is used.'
    required: false
    default: ''
  deploy-gate-health-url:
    description: 'If set (and event is push), wait until this endpoint reports the pushed commit SHA before screenshotting. Prevents capturing the old UI while a deploy is in flight.'
    required: false
    default: ''
  deploy-gate-sha-json-path:
    description: 'jq path to the deployed commit SHA in the health response.'
    required: false
    default: '.commit'
  deploy-gate-timeout-seconds:
    description: 'How long to wait for the deploy before failing.'
    required: false
    default: '720'
  history-commit-name:
    description: 'git user.name for the history commit. Defaults to the triggering actor (a real account Vercel will deploy from).'
    required: false
    default: '${{ github.actor }}'
  history-commit-email:
    description: 'git user.email for the history commit. Defaults to the actor''s github-noreply address, which Vercel maps to a real, trusted deployer.'
    required: false
    default: '${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com'
  github-token:
    description: 'Token used to read commit context and push the history commit.'
    required: false
    default: '${{ github.token }}'
  sha:
    description: 'Commit SHA to post about (backfill). Leave empty on push events to use the pushed commit.'
    required: false
    default: ''
  before-sha:
    description: 'Branch tip before this push (pass the push event''s before field). Used to diff the true net change instead of the single pushed commit''s diff — fixes merge commits (e.g. a rejected push resolved with `git pull` instead of `git pull --rebase`) showing whatever was already on the branch instead of the actual work being pushed. Leave empty to fall back to the single-commit diff (e.g. workflow_dispatch backfill, which has no "before").'
    required: false
    default: ''
  dry-run:
    description: 'When "true", run the whole pipeline (draft + screenshot) but do NOT publish to X or write history. The drafted text and image are logged to the job summary. Use it to preview voice/screenshots before wiring to real merges.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install action deps
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install --no-audit --no-fund

    - name: Install Chromium for Playwright
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npx playwright install --with-deps chromium

    # Deploy-gate: on a fresh push, don't screenshot the deployed site until it
    # actually serves the pushed commit, or it captures the OLD UI. Polls the
    # consumer's health endpoint (which must expose the deployed commit SHA).
    # Push-only: backfills target already-landed SHAs that won't match prod, so
    # they screenshot prod as-is.
    - name: Wait for deploy
      if: github.event_name == 'push' && inputs.deploy-gate-health-url != ''
      shell: bash
      env:
        TARGET_SHA: ${{ github.sha }}
        HEALTH_URL: ${{ inputs.deploy-gate-health-url }}
        SHA_JSON_PATH: ${{ inputs.deploy-gate-sha-json-path }}
        TIMEOUT: ${{ inputs.deploy-gate-timeout-seconds }}
      run: |
        echo "Waiting for $HEALTH_URL to report commit $TARGET_SHA (path '$SHA_JSON_PATH', up to ${TIMEOUT}s)."
        deadline=$(( $(date +%s) + TIMEOUT ))
        while [ "$(date +%s)" -lt "$deadline" ]; do
          deployed=$(curl -fsS "$HEALTH_URL?t=$(date +%s)" | jq -r "${SHA_JSON_PATH} // empty" || true)
          if [ "$deployed" = "$TARGET_SHA" ]; then
            echo "Deployed commit matches target — proceeding."
            exit 0
          fi
          echo "Deployed commit is '${deployed:-<none>}'; not yet '$TARGET_SHA'. Retrying in 15s…"
          sleep 15
        done
        echo "::error::Deploy of $TARGET_SHA not detected within ${TIMEOUT}s; refusing to post a stale screenshot."
        exit 1

    - name: Generate post and publish to X
      id: post
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        AUTOPOST_DATA_DIR: .github/auto-post
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        # Backfill SHA input wins if present; otherwise the pushed commit.
        GITHUB_SHA: ${{ inputs.sha != '' && inputs.sha || github.sha }}
        GITHUB_BEFORE_SHA: ${{ inputs.before-sha }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        TRIGGER: ${{ github.event_name }}
        DRY_RUN: ${{ inputs.dry-run }}
        HOMEPAGE_URL: ${{ inputs.homepage-url }}
        ROUTES: ${{ inputs.routes }}
        INTERACTIVE_SHOTS: ${{ inputs.interactive-shots }}
        INTERACTION_HINTS: ${{ inputs.interaction-hints }}
        INTERACTION_VIDEOS: ${{ inputs.interaction-videos }}
        ZOOM_CAMERA: ${{ inputs.zoom-camera }}
        MAX_BUNDLE_IMAGES: ${{ inputs.max-bundle-images }}
        INCLUDE_COMMIT_LINK: ${{ inputs.include-commit-link }}
        OPTIMIZE_POST: ${{ inputs.optimize-post }}
        OPTIMIZE_TARGET: ${{ inputs.optimize-target }}
        OPTIMIZE_ITERATIONS: ${{ inputs.optimize-iterations }}
        POST_SCORER_LICENSE_KEY: ${{ inputs.post-scorer-license-key }}
        GEMINI_MODEL: ${{ inputs.gemini-model }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        X_API_KEY: ${{ inputs.x-api-key }}
        X_API_SECRET: ${{ inputs.x-api-secret }}
        X_ACCESS_TOKEN: ${{ inputs.x-access-token }}
        X_ACCESS_TOKEN_SECRET: ${{ inputs.x-access-token-secret }}
      run: node "$GITHUB_ACTION_PATH/post.mjs"

    # Dry-run only: GITHUB_STEP_SUMMARY is text-only, so the chosen image(s)
    # can't ride along in it — upload the actual PNGs (absolute paths on the
    # runner, written by post.mjs to $GITHUB_OUTPUT, one per line when a push
    # bundles multiple changes) as a downloadable artifact instead.
    - name: Upload dry-run preview image(s)
      if: success() && inputs.dry-run == 'true' && steps.post.outputs.image_paths != ''
      uses: actions/upload-artifact@v4
      with:
        name: auto-post-dry-run-preview
        path: ${{ steps.post.outputs.image_paths }}
        retention-days: 7

    - name: Persist post history
      # Skip in dry-run: post.mjs writes no history.jsonl (nothing was posted),
      # so there's nothing to commit — and the data dir may not even exist in
      # referenced mode, which would make `git add` fail.
      if: success() && inputs.dry-run != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        HISTORY_NAME: ${{ inputs.history-commit-name }}
        HISTORY_EMAIL: ${{ inputs.history-commit-email }}
        BRANCH: ${{ github.ref_name }}
      run: |
        git config user.name "$HISTORY_NAME"
        git config user.email "$HISTORY_EMAIL"
        git add .github/auto-post/history.jsonl
        if git diff --cached --quiet; then
          echo "No history changes to commit."
          exit 0
        fi
        git commit -m "chore(auto-post): record post history [skip ci]"
        # main may have moved while this job ran; rebase our one commit onto its
        # tip. Works from the detached HEAD that actions/checkout leaves.
        git fetch origin "$BRANCH"
        git rebase "origin/$BRANCH"
        git push origin "HEAD:$BRANCH"
